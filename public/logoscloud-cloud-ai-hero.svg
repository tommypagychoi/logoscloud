<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Logos Cloud animated AI StoryRoom dashboard</title>
  <desc id="desc">Animated enterprise AI StoryRoom, multi cloud and Kubernetes operations visual</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#0b223d"/>
      <stop offset="1" stop-color="#0e3b47"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0" stop-color="#12365b" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0d7c86" stop-opacity="0.72"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="40%" r="42%">
      <stop offset="0" stop-color="#38d5ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38d5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
    <style>
      .float-slow { animation: floatSlow 8s ease-in-out infinite; transform-origin: center; }
      .float-fast { animation: floatFast 5.5s ease-in-out infinite; transform-origin: center; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      .dash { stroke-dasharray: 12 16; animation: dash 5s linear infinite; }
      .scan { animation: scan 3.8s ease-in-out infinite; }
      .bar-a { animation: barA 4s ease-in-out infinite; }
      .bar-b { animation: barB 4.8s ease-in-out infinite; }
      .bar-c { animation: barC 3.4s ease-in-out infinite; }
      @keyframes floatSlow { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
      @keyframes floatFast { 0%,100% { transform: translateY(0); } 50% { transform: translateY(10px); } }
      @keyframes pulse { 0%,100% { opacity: .45; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
      @keyframes dash { to { stroke-dashoffset: -180; } }
      @keyframes scan { 0% { transform: translateY(-120px); opacity: 0; } 18%,76% { opacity: .72; } 100% { transform: translateY(380px); opacity: 0; } }
      @keyframes barA { 0%,100% { width: 110px; } 50% { width: 175px; } }
      @keyframes barB { 0%,100% { width: 180px; } 50% { width: 98px; } }
      @keyframes barC { 0%,100% { width: 150px; } 50% { width: 230px; } }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)" class="pulse"/>
  <path d="M0 0h720c-140 170-198 347-172 530 18 126 64 241 138 345H0z" fill="#030914" opacity="0.72"/>
  <g opacity="0.22" stroke="#77e7ff" stroke-width="1" class="dash">
    <path d="M840 120C980 230 1050 350 1160 520c96 148 206 214 332 246" fill="none"/>
    <path d="M780 270c170 20 318 92 442 214 94 92 194 154 300 186" fill="none"/>
    <path d="M920 720c74-124 178-221 312-292 98-52 188-134 268-246" fill="none"/>
  </g>
  <g filter="url(#softShadow)">
    <rect x="760" y="118" width="700" height="438" rx="18" fill="#08182d" stroke="#2b6f92"/>
    <rect x="782" y="134" width="656" height="4" rx="2" fill="#74eaff" opacity="0.7" class="scan"/>
    <g class="float-slow">
      <rect x="790" y="150" width="200" height="150" rx="12" fill="url(#panel)"/>
      <rect x="1015" y="150" width="190" height="150" rx="12" fill="#0b2947" stroke="#1f7ea5"/>
      <rect x="1230" y="150" width="200" height="150" rx="12" fill="#0b2947" stroke="#1f7ea5"/>
    </g>
    <g class="float-fast">
      <rect x="790" y="326" width="310" height="190" rx="12" fill="#0b2947" stroke="#1f7ea5"/>
      <rect x="1125" y="326" width="305" height="190" rx="12" fill="url(#panel)"/>
    </g>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M826 245h36l24-54 36 86 24-42h38" stroke="#41e7c3" stroke-width="7" class="dash"/>
    <path d="M1048 246c34-56 72-56 116 0" stroke="#49b9ff" stroke-width="7" class="dash"/>
    <path d="M1272 248h36l24-34 34 42 38-82" stroke="#41e7c3" stroke-width="7" class="dash"/>
    <path d="M836 466c66-96 130-96 194 0" stroke="#49b9ff" stroke-width="6" opacity="0.9" class="dash"/>
    <path d="M1168 466c32-74 74-104 126-90 42 12 72 42 90 90" stroke="#41e7c3" stroke-width="6" opacity="0.9" class="dash"/>
  </g>
  <g fill="#dff8ff" font-family="Arial, Helvetica, sans-serif" font-weight="700" opacity="0.9">
    <text x="820" y="178" font-size="22">STORYROOM</text>
    <text x="1044" y="178" font-size="22">AI AGENT</text>
    <text x="1260" y="178" font-size="22">CLOUD</text>
  </g>
  <g>
    <circle cx="934" cy="634" r="54" fill="#0b2947" stroke="#49b9ff" stroke-width="3" class="pulse"/>
    <circle cx="1110" cy="666" r="62" fill="#0b2947" stroke="#41e7c3" stroke-width="3" class="pulse"/>
    <circle cx="1280" cy="630" r="50" fill="#0b2947" stroke="#49b9ff" stroke-width="3" class="pulse"/>
    <path d="M988 646c34 8 52 12 68 14M1172 654c30-8 50-14 64-18" stroke="#9cecff" stroke-width="4" fill="none" class="dash"/>
    <g fill="#9cecff">
      <circle cx="934" cy="634" r="8"/><circle cx="1110" cy="666" r="8"/><circle cx="1280" cy="630" r="8"/>
      <circle cx="900" cy="604" r="5" class="pulse"/><circle cx="970" cy="612" r="5" class="pulse"/><circle cx="1090" cy="620" r="5" class="pulse"/><circle cx="1142" cy="704" r="5" class="pulse"/><circle cx="1252" cy="594" r="5" class="pulse"/><circle cx="1312" cy="660" r="5" class="pulse"/>
    </g>
  </g>
  <g opacity="0.84">
    <rect x="690" y="650" width="720" height="120" rx="18" fill="#07111f" stroke="#2b6f92"/>
    <rect x="730" y="692" height="10" rx="5" fill="#41e7c3" class="bar-a"/>
    <rect x="870" y="692" height="10" rx="5" fill="#49b9ff" class="bar-b"/>
    <rect x="1080" y="692" width="90" height="10" rx="5" fill="#e8c468"/>
    <rect x="1210" y="692" height="10" rx="5" fill="#41e7c3" class="bar-c"/>
    <rect x="730" y="728" width="260" height="10" rx="5" fill="#7dd3fc" opacity="0.5"/>
    <rect x="1020" y="728" width="340" height="10" rx="5" fill="#7dd3fc" opacity="0.35"/>
  </g>
</svg>
